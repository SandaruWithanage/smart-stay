spring:
  application:
    name: smartstay-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartstay}
    username: ${DB_USERNAME:smartstay}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=200,expireAfterWrite=5m

smartstay:
  security:
    jwt-secret-base64: ${SMARTSTAY_JWT_SECRET_BASE64:}
  bootstrap:
    admin-email: ${SMARTSTAY_BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${SMARTSTAY_BOOTSTRAP_ADMIN_PASSWORD:}

server:
  port: ${PORT:8080}
