name: SmartStay CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: smartstay
          POSTGRES_USER: smartstay
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartstay -d smartstay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DB_URL: jdbc:postgresql://localhost:5432/smartstay
      DB_USERNAME: smartstay
      DB_PASSWORD: test-only-password
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Test Java backend and PostgreSQL migration
        run: mvn -B --no-transfer-progress test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build frontend
        run: npm run build
